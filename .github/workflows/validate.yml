name: Validate Jekyll Build (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify generated pages
        run: |
          set -e
          test -f _site/index.html
          for term in "Junteng Liu" "SynLogic" "Perception Bottleneck of VLMs for Chart Understanding" "Universal Truthfulness Hyperplane Inside LLMs" "In-Context Sharpness as Alerts" "C-Eval" "Composing Parameter-Efficient Modules with Arithmetic Operations" "jliugi@connect.ust.hk" "Vicent0205" "tbK9jl4AAAAJ" "junteng88716710" "Zhiyuan Honor Scholarship" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Vision4Chart" "Universal_Truthfulness_Hyperplane" "Junxian He" "Zifei Shan" "Yu Cheng" "LLM Reasoning and Reinforcement Learning" "Hallucination in Vision-Language Models" "LLM Truthfulness and Interpretability" "B.Eng." "Ph.D. in Computer Science"; do
            grep -q "$term" _site/index.html || { echo "MISSING IN INDEX: $term"; exit 1; }
          done
          echo "All about-page terms found."
          ls _site/publications/
          grep -q "SynLogic" _site/publications/index.html || { echo "MISSING SynLogic on publications page"; exit 1; }
          grep -q "Composing Parameter-Efficient Modules" _site/publications/index.html || { echo "MISSING last publication on publications page"; exit 1; }
          echo "Publications page OK."
