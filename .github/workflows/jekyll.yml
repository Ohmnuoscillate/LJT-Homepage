# Temporary validation build (will be restored to Pages deployment)
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check about page content
        run: grep -q "Junteng Liu" _site/index.html && grep -q "SynLogic" _site/index.html && grep -q "Perception Bottleneck of VLMs for Chart Understanding" _site/index.html && grep -q "Universal Truthfulness Hyperplane Inside LLMs" _site/index.html && grep -q "In-Context Sharpness as Alerts" _site/index.html && grep -q "C-Eval" _site/index.html && grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html && grep -q "jliugi@connect.ust.hk" _site/index.html && grep -q "Vicent0205" _site/index.html && grep -q "tbK9jl4AAAAJ" _site/index.html && grep -q "junteng88716710" _site/index.html && grep -q "Zhiyuan Honor Scholarship" _site/index.html && grep -q "MINIMAX" _site/index.html && grep -q "Tencent WXG" _site/index.html && grep -q "Shanghai AI Lab" _site/index.html && grep -q "Vision4Chart" _site/index.html && grep -q "Universal_Truthfulness_Hyperplane" _site/index.html && grep -q "Junxian He" _site/index.html && grep -q "Zifei Shan" _site/index.html && grep -q "Yu Cheng" _site/index.html && grep -q "LLM Reasoning and Reinforcement Learning" _site/index.html && grep -q "Hallucination in Vision-Language Models" _site/index.html && grep -q "LLM Truthfulness and Interpretability" _site/index.html && grep -q "Ph.D. in Computer Science" _site/index.html && grep -q "B.Eng." _site/index.html
      - name: Check publications page content
        run: grep -q "SynLogic" _site/publications/index.html && grep -q "Universal Truthfulness Hyperplane" _site/publications/index.html && grep -q "Composing Parameter-Efficient" _site/publications/index.html && grep -q "NeurIPS 2023" _site/publications/index.html && grep -q "EMNLP 2024" _site/publications/index.html && grep -q "ICML 2024" _site/publications/index.html
