# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll (validation)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check about page content
        run: grep -q "Junteng Liu" _site/index.html && grep -q "SynLogic" _site/index.html && grep -q "Perception Bottleneck of VLMs for Chart Understanding" _site/index.html && grep -q "Universal Truthfulness Hyperplane Inside LLMs" _site/index.html && grep -q "In-Context Sharpness as Alerts" _site/index.html && grep -q "C-Eval" _site/index.html && grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html && grep -q "jliugi@connect.ust.hk" _site/index.html && grep -q "Vicent0205" _site/index.html && grep -q "tbK9jl4AAAAJ" _site/index.html && grep -q "junteng88716710" _site/index.html && grep -q "Zhiyuan Honor Scholarship" _site/index.html && grep -q "MINIMAX" _site/index.html && grep -q "Tencent WXG" _site/index.html && grep -q "Shanghai AI Lab" _site/index.html && grep -q "Vision4Chart" _site/index.html && grep -q "Universal_Truthfulness_Hyperplane" _site/index.html && grep -q "Junxian He" _site/index.html && grep -q "Zifei Shan" _site/index.html && grep -q "Yu Cheng" _site/index.html && grep -q "LLM Reasoning and Reinforcement Learning" _site/index.html && grep -q "Hallucination in Vision-Language Models" _site/index.html && grep -q "LLM Truthfulness and Interpretability" _site/index.html && grep -q "Ph.D. in Computer Science" _site/index.html && grep -q "B.Eng." _site/index.html && echo ABOUT_PAGE_CHECKS_PASSED
      - name: Check publications page content
        run: grep -q "SynLogic" _site/publications/index.html && grep -q "Universal Truthfulness Hyperplane" _site/publications/index.html && grep -q "Composing Parameter-Efficient" _site/publications/index.html && grep -q "NeurIPS 2023" _site/publications/index.html && grep -q "EMNLP 2024" _site/publications/index.html && grep -q "ICML 2024" _site/publications/index.html && echo PUBLICATIONS_PAGE_CHECKS_PASSED
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
